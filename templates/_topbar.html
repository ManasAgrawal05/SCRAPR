<div class="tb-widgets" data-game="{{ game or '' }}">
  <button type="button" class="top-icon tb-apps" aria-label="Menu" title="Menu"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
  <button type="button" class="tb-profile" aria-label="Profile" title="Profile"><span class="av"></span><span class="pname"></span></button>

  <div class="tb-pop" hidden>
    <h3>Your profile</h3>
    <div class="pop-avatar">
      <span class="av av-lg pop-preview"></span>
      <label class="btn pop-file">Add image<input type="file" accept="image/*" hidden></label>
      <button type="button" class="linkbtn pop-remove" hidden>Remove</button>
    </div>
    <label class="pop-label">Username
      <input class="pop-name" maxlength="24" placeholder="Username" autocomplete="off" spellcheck="false">
    </label>
    <div class="pop-error"></div>
    <div class="pop-actions"><button type="button" class="btn pop-cancel">Cancel</button><button type="button" class="btn btn-primary pop-save">Save</button></div>
  </div>

  <div class="tb-menu" hidden>
    <div class="menu-view" data-view="grid">
      <div class="apps-grid">
        {% if game %}<button type="button" class="app-tile" data-go="leaderboard"><svg viewBox="0 0 24 24" width="36" height="36"><path fill="#4285f4" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Leaderboard</span></button>
        {% endif %}<button type="button" class="app-tile" data-go="rules"><svg viewBox="0 0 24 24" width="36" height="36"><path fill="#ea4335" d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg><span>Rules</span></button>
        {% if game %}<button type="button" class="app-tile" data-go="settings"><svg viewBox="0 0 24 24" width="36" height="36"><path fill="#34a853" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>Settings</span></button>
        {% endif %}
      </div>
    </div>
    <div class="menu-view" data-view="rules" hidden>
      <div class="menu-head"><button type="button" class="menu-back" aria-label="Back">&larr;</button><b>Rules</b><button type="button" class="menu-close" aria-label="Close">&times;</button></div>
      {% include "_rules.html" %}
    </div>
    {% if game %}
    <div class="menu-view" data-view="leaderboard" hidden>
      <div class="menu-head"><button type="button" class="menu-back" aria-label="Back">&larr;</button><b>Leaderboard</b><button type="button" class="menu-close" aria-label="Close">&times;</button></div>
      <ol class="lb-list"></ol>
    </div>
    <div class="menu-view" data-view="settings" hidden>
      <div class="menu-head"><button type="button" class="menu-back" aria-label="Back">&larr;</button><b>Settings</b><button type="button" class="menu-close" aria-label="Close">&times;</button></div>
      <div class="menu-body">
        <div class="set-row">
          <span>Questions</span>
          <div class="seg" role="group" aria-label="Question difficulty">
            <button type="button" data-v="easy">Easy</button><button type="button" data-v="difficult">Difficult</button>
          </div>
        </div>
        <label class="set-row">
          <span>Block the question&rsquo;s key words in searches</span>
          <input type="checkbox" class="switch set-block">
        </label>
        <div class="set-note"></div>
      </div>
    </div>
    {% endif %}
  </div>
</div>
