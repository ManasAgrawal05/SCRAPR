<div class="searchbox-wrap">
  <form id="searchForm" class="searchbox" action="/search" method="get" autocomplete="off" role="search">
    <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
    <input type="text" name="q" value="{{ q or '' }}" aria-label="Search" placeholder="{{ placeholder or "" }}" autocapitalize="off" spellcheck="false" {% if autofocus %}autofocus{% endif %}>
    {% if q %}<button type="button" class="clear" aria-label="Clear" title="Clear">&times;</button>{% endif %}
    {% if q %}<button type="submit" class="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#4285f4" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg></button>{% endif %}
    {% if game %}<input type="hidden" name="game" value="{{ game }}">{% endif %}
    <ul class="suggestions" hidden></ul>
  </form>
  {% if game %}<div class="banned-note" hidden></div>{% endif %}
</div>
